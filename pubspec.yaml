name: recipemate
description: "RecipeMate - Anti-gaspi & smart cooking mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  http: ^1.2.1
  mobile_scanner: ^5.1.1
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0
  firebase_storage: ^14.1.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  # Point 4/7 : notifications locales (péremption + rappels de repas).
  flutter_local_notifications: ^23.0.3
  # Nécessaire pour planifier une notification à une heure précise (TZDateTime).
  timezone: ^0.11.2
  # Obtention du fuseau horaire natif (Android/iOS) pour la planification exacte.
  flutter_timezone: ^4.1.0
  # Logos vectoriels RecipeMate (splash, connexion, en-têtes) — remplace le PNG placeholder.
  flutter_svg: ^2.5.0

dev_dependencies:
  # Génère les icônes Android/iOS depuis assets/icon/icon.png (logo vert).
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  # Logos vectoriels officiels + PNG générés pour l'icône et le splash natif.
  assets:
    - assets/images/
    - assets/icon/

# Icône de l'application (Android + iOS) générée avec flutter_launcher_icons.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # iOS interdit la transparence : on fond les coins du logo sur le vert marque.
  remove_alpha_ios: true
  background_color_ios: "#527C43"
